name: Deploy Quartz site to GitHub Pages

# Deploys the v5 site to production GitHub Pages on every push to v5, plus a
# manual trigger. v4 is retained as a rollback branch (still allowed to deploy
# in the github-pages environment).
on:
  workflow_dispatch:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Quartz 5 resolves plugins from quartz.lock.json, so cache on that.
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      # Required in v5: plugins are standalone repos and must be installed
      # before the build can resolve them. `--from-config` re-resolves every
      # entry in quartz.config.yaml, which is what makes the repo-local
      # `./plugins/inline-comments` source resolve on a fresh CI checkout
      # (its lockfile path is machine-specific).
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
