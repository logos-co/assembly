name: Deploy Quartz site to GitHub Pages

# Deploys the v5 site to production GitHub Pages on every push to v5, plus a
# manual trigger. v4 is retained as a rollback branch (still allowed to deploy
# in the github-pages environment).
on:
  workflow_dispatch:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # Required in v5: plugins are standalone repos and must be installed
      # before the build can resolve them. `--from-config` re-resolves every
      # entry in quartz.config.yaml and clones each github: source fresh.
      #
      # We do NOT cache .quartz/plugins: a partial (restore-keys) cache hit can
      # carry stale plugin entries across a lockfile change — e.g. dangling
      # symlinks from a since-removed local source — which crashes install with
      # ENOENT. `.quartz` is git-ignored and the runner is ephemeral, so this
      # rm is just belt-and-suspenders.
      - name: Install Quartz plugins
        run: |
          rm -rf .quartz/plugins
          npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
