<g fill="#888888" text-anchor="middle">
<text x="110" y="62" font-size="13" font-weight="600">Discovery</text><text x="110" y="84" font-size="10.5">intent, fingerprint, IP</text>
<text x="280" y="62" font-size="13" font-weight="600">Diligence</text><text x="280" y="84" font-size="10.5">address history, graph</text>
<text x="450" y="62" font-size="13" font-weight="600">Negotiation</text><text x="450" y="84" font-size="10.5">size, terms, timing</text>
<text x="620" y="62" font-size="13" font-weight="600">Contracting</text><text x="620" y="84" font-size="10.5">IP pairing, frontend</text>
<text x="620" y="222" font-size="13" font-weight="600">Ordering</text><text x="620" y="244" font-size="10.5">pending flow, calldata</text>
<text x="450" y="222" font-size="13" font-weight="600">Settlement</text><text x="450" y="244" font-size="10.5">balances, validators</text>
<text x="280" y="222" font-size="13" font-weight="600">Enforcement</text><text x="280" y="244" font-size="10.5">operator identity</text>
<text x="110" y="222" font-size="13" font-weight="600">The archive</text><text x="110" y="244" font-size="10.5">feeds the next tx</text>
<text x="380" y="160" font-size="11">every link leaks; the leaks are archived</text>
<text x="380" y="300" font-size="10.5">teal = the one secured link &#183; amber = the loop closing &#183; arrows = one transaction's lifecycle</text>
</g>
